name: Scaffolding Synchronization Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - '.github/scripts/**'
      - '.github/workflows/sync.yml'
      - 'target-repos.yml'
      - 'files-to-sync.yml'
  workflow_dispatch: # Allows triggering the sync manually from the Actions tab

concurrency:
  group: scaffolding-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-targets:
    name: Discover Target Repositories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse Target Repositories
        id: set-matrix
        run: |
          python3 -c "
          import json, os

          repos = []
          with open('target-repos.yml') as f:
              for line in f:
                  line = line.strip()
                  if line.startswith('-'):
                      repo = line.lstrip('-').strip().strip('\'\"')
                      if repo:
                          repos.append(repo)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'matrix={json.dumps(repos)}\n')
          "

  sync-scaffolding:
    name: Sync ${{ matrix.repo }}
    needs: discover-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJson(needs.discover-targets.outputs.matrix) }}
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Configure Execution Permissions
        run: chmod +x .github/scripts/*.sh .github/scripts/*.py

      - name: Execute Template Sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN_YOLANDASANTACRUZ: ${{ secrets.SYNC_TOKEN_YOLANDASANTACRUZ }}
          SYNC_TOKEN_ZELENIA_LABS: ${{ secrets.SYNC_TOKEN_ZELENIA_LABS }}
        run: .github/scripts/sync-repos.sh "${{ matrix.repo }}"
