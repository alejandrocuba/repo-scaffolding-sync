name: Scaffolding Synchronization Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - '.github/scripts/**'
      - 'target-repos.yml'
      - 'files-to-sync.yml'
  workflow_dispatch: # Allows triggering the sync manually from the Actions tab

concurrency:
  group: scaffolding-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-scaffolding:
    name: Synchronize Scaffolding Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configure Execution Permissions
        run: chmod +x .github/scripts/*.sh .github/scripts/*.py

      - name: Execute Template Sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN_YOLANDASANTACRUZ: ${{ secrets.SYNC_TOKEN_YOLANDASANTACRUZ }}
          SYNC_TOKEN_ZELENIA_LABS: ${{ secrets.SYNC_TOKEN_ZELENIA_LABS }}
        run: .github/scripts/sync-repos.sh
